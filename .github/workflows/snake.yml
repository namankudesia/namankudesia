name: Generate Snake Game Contribution Grid

on:
  schedule:
    - cron: "0 0 * * *"  # Runs every day at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@master
        with:
          github_user_name: namankudesia  # Replace with your GitHub username
          svg_out_path: dist/github-snake.svg  # Correct output path
          gif_out_path: dist/github-snake.gif  # Generates a GIF too

      - name: Upload Snake SVG as an Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-artifacts
          path: dist

      - name: Push the Generated Snake SVG to the Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
